version: '3.8'

services:
  backend:
    build:
      context: ./backend
    container_name: devops_backend
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: devops_frontend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
    restart: unless-stopped
    depends_on:
      - backend
